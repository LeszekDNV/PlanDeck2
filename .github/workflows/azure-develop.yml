# Deploys the PlanDeck develop branch to Azure Container Apps + Azure SQL via `azd`.
#
# One-time setup (human, requires an Azure subscription):
#   1. Add a federated credential to the existing `plandeck-pipeline-oidc` Entra application with
#      subject `repo:LeszekDNV/PlanDeck2:ref:refs/heads/develop`; keep Owner on `rg-test` and
#      AcrPush on the container registry.
#   2. The pipeline service principal remains a contained `db_owner` user in `PlanDeckDb` so the
#      migration step can apply the schema.
#   3. Reuse the repository variables below for the shared Testing environment.
#
# Required repo variables (Settings -> Secrets and variables -> Actions -> Variables):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_ENV_NAME (= test),
#   AZURE_LOCATION (= polandcentral), SQL_SERVER_FQDN
# Required Testing environment values:
#   Variables: AZURE_ENTRA_TENANT_ID, AZURE_ENTRA_CLIENT_ID
#   Secret: AZURE_ENTRA_CLIENT_SECRET
# No long-lived secrets are stored: auth to Azure is OIDC federated.

name: Deploy PlanDeck develop (Testing)

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      reset_database:
        description: "Delete all application tables before applying migrations"
        required: false
        default: false
        type: boolean

# OIDC federated auth needs id-token: write.
permissions:
  id-token: write
  contents: read

concurrency:
  group: plandeck-testing-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Testing
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_ENTRA_TENANT_ID: ${{ vars.AZURE_ENTRA_TENANT_ID }}
      AZURE_ENTRA_CLIENT_ID: ${{ vars.AZURE_ENTRA_CLIENT_ID }}
      AZURE_ENTRA_CLIENT_SECRET: ${{ secrets.AZURE_ENTRA_CLIENT_SECRET }}
      PLANDECK_PUBLISH_TARGET: "Testing"
      # Deploy into the existing resource group (RG-scoped deployment) so the
      # pipeline SP only needs Owner on rg-test, not subscription-level rights.
      AZURE_RESOURCE_GROUP: rg-${{ vars.AZURE_ENV_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          # Install the exact SDK pinned in global.json (10.0.301). Using "10.0.x" would install a
          # newer patch whose bundled Microsoft.NET.Sdk.WebAssembly.Pack has a different content
          # hash than the one recorded in packages.lock.json, failing restore with NU1403.
          global-json-file: src/PlanDeck/global.json

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Sign in to azd (federated OIDC)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"

      # az CLI is needed to mint an Azure SQL access token for the migration step.
      - name: Sign in to Azure CLI (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate Microsoft Entra configuration
        uses: ./.github/actions/validate-azure-entra-config
        with:
          tenant-id: ${{ env.AZURE_ENTRA_TENANT_ID }}
          client-id: ${{ env.AZURE_ENTRA_CLIENT_ID }}
          client-secret: ${{ env.AZURE_ENTRA_CLIENT_SECRET }}
          publish-target: ${{ env.PLANDECK_PUBLISH_TARGET }}

      - name: Provision infrastructure
        working-directory: src/PlanDeck
        run: azd provision --no-prompt

      # GitHub-hosted runners have dynamic public IPs that the Azure SQL firewall blocks by
      # default. Open a temporary, run-scoped firewall rule for this runner's IP before applying
      # migrations; the cleanup step below removes it even if the migration fails.
      - name: Open SQL firewall for runner
        shell: pwsh
        env:
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
        run: |
          $ip = (Invoke-RestMethod -Uri "https://api.ipify.org").Trim()
          $server = $env:SQL_SERVER_FQDN.Split('.')[0]
          $rg = "rg-${{ vars.AZURE_ENV_NAME }}"
          az sql server firewall-rule create -g $rg -s $server -n "gh-runner-${{ github.run_id }}" `
            --start-ip-address $ip --end-ip-address $ip -o none
          "RUNNER_FW_SERVER=$server"  | Out-File $env:GITHUB_ENV -Append
          "RUNNER_FW_RG=$rg"          | Out-File $env:GITHUB_ENV -Append

      - name: Wait for Azure SQL readiness
        uses: ./.github/actions/wait-for-azure-sql
        with:
          server-instance: ${{ vars.SQL_SERVER_FQDN }}
          database-name: PlanDeckDb
          max-wait-seconds: "300"

      - name: Reset database schema
        if: ${{ inputs.reset_database == true }}
        shell: pwsh
        env:
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
          SQL_DATABASE_NAME: PlanDeckDb
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module SqlServer -ErrorAction Stop
          $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
          $query = @'
          DECLARE @sql nvarchar(max) = N'';
          SELECT @sql += N'ALTER TABLE '
              + QUOTENAME(OBJECT_SCHEMA_NAME(parent_object_id)) + N'.'
              + QUOTENAME(OBJECT_NAME(parent_object_id)) + N' DROP CONSTRAINT '
              + QUOTENAME(name) + N';'
          FROM sys.foreign_keys;
          IF LEN(@sql) > 0 EXEC sys.sp_executesql @sql;

          SET @sql = N'';
          SELECT @sql += N'DROP TABLE '
              + QUOTENAME(SCHEMA_NAME(schema_id)) + N'.'
              + QUOTENAME(name) + N';'
          FROM sys.tables
          WHERE is_ms_shipped = 0;
          IF LEN(@sql) > 0 EXEC sys.sp_executesql @sql;
          '@
          Invoke-Sqlcmd -ServerInstance $env:SQL_SERVER_FQDN -Database $env:SQL_DATABASE_NAME `
            -AccessToken $token -Query $query -AbortOnError -ConnectionTimeout 30 -QueryTimeout 120

      # Apply EF Core migrations as an explicit, idempotent gate BEFORE the app is deployed.
      # `dotnet ef migrations script` builds SQL from the model offline (no DB connection), so the
      # design-time factory's local connection string is irrelevant here. The script is applied to
      # Azure SQL using an AAD access token from the federated identity (a db_owner contained user).
      - name: Apply EF Core migrations
        shell: pwsh
        working-directory: src/PlanDeck
        env:
          SQL_SERVER_FQDN: ${{ vars.SQL_SERVER_FQDN }}
          SQL_DATABASE_NAME: PlanDeckDb
        run: |
          $ErrorActionPreference = "Stop"
          Import-Module SqlServer -ErrorAction Stop
          dotnet tool install --global dotnet-ef
          $env:PATH += [IO.Path]::PathSeparator + (Join-Path $HOME ".dotnet/tools")
          dotnet ef migrations script --idempotent `
            --project Core/PlanDeck.Infrastructure/PlanDeck.Infrastructure.csproj `
            --startup-project Web/PlanDeck.Server/PlanDeck.Server.csproj `
            --output migrate.sql
          $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
          Invoke-Sqlcmd -ServerInstance $env:SQL_SERVER_FQDN -Database $env:SQL_DATABASE_NAME `
            -AccessToken $token -InputFile migrate.sql -AbortOnError -ConnectionTimeout 30 -QueryTimeout 600

      - name: Close SQL firewall for runner
        if: always()
        shell: pwsh
        run: |
          if ($env:RUNNER_FW_SERVER) {
            az sql server firewall-rule delete -g $env:RUNNER_FW_RG -s $env:RUNNER_FW_SERVER `
              -n "gh-runner-${{ github.run_id }}" -o none 2>$null
          }

      - name: Deploy application
        working-directory: src/PlanDeck
        run: azd deploy --no-prompt

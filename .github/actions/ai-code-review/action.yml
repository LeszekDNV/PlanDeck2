name: PlanDeck AI code review
description: Collects a bounded static PR diff and requests one structured GitHub Models review.

inputs:
  model:
    description: GitHub Models catalog identifier.
    required: false
    default: openai/gpt-4.1-mini
  expected-base-branch:
    description: Only pull requests targeting this branch are eligible.
    required: false
    default: develop
  input-token-budget:
    description: Conservative total input-token budget.
    required: false
    default: "8000"
  output-token-budget:
    description: Maximum response tokens.
    required: false
    default: "4000"

outputs:
  result-path:
    description: Absolute path to the validated structured review result.
    value: ${{ steps.review.outputs.result-path }}
  analysis-complete:
    description: Whether trusted input collection represented the complete reviewable diff.
    value: ${{ steps.review.outputs.analysis-complete }}
  reviewed-head-sha:
    description: Pull request head SHA represented by the result.
    value: ${{ steps.review.outputs.reviewed-head-sha }}

runs:
  using: composite
  steps:
    - id: review
      name: Collect diff and request review
      shell: pwsh
      env:
        AI_CR_MODEL: ${{ inputs.model }}
        AI_CR_EXPECTED_BASE_BRANCH: ${{ inputs.expected-base-branch }}
        AI_CR_INPUT_TOKEN_BUDGET: ${{ inputs.input-token-budget }}
        AI_CR_OUTPUT_TOKEN_BUDGET: ${{ inputs.output-token-budget }}
      run: >-
        & '${{ github.action_path }}/review.ps1'
        -Model $env:AI_CR_MODEL
        -ExpectedBaseBranch $env:AI_CR_EXPECTED_BASE_BRANCH
        -InputTokenBudget $env:AI_CR_INPUT_TOKEN_BUDGET
        -OutputTokenBudget $env:AI_CR_OUTPUT_TOKEN_BUDGET
